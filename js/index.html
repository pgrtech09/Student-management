<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incharge Dashboard | Vidya Campus</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#1B2A4A">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="mark">VC</div><div class="name">Vidya Campus</div></div>
    <div class="who">
      <span class="role-pill">Incharge</span>
      <div class="name" id="who-name">—</div>
      <div class="meta" id="who-meta">—</div>
    </div>
    <nav>
      <div class="nav-item active" data-view="students">Student List</div>
      <div class="nav-item" data-view="attendance">Attendance Entry</div>
      <div class="nav-item" data-view="leave">Leave Requests</div>
      <div class="nav-item" data-view="marks">Marks Upload</div>
      <div class="nav-item" data-view="reports">Reports</div>
      <div class="nav-item" data-view="notices">Send Notice</div>
    </nav>
    <div class="sidebar-footer">
      <div class="logout-link" onclick="logout()">Sign out</div>
      <button class="theme-toggle" id="theme-toggle-btn" onclick="toggleTheme()">🌙</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-header">
      <div>
        <h1 id="view-title">Student List</h1>
        <div class="date-sub" id="today-date"></div>
      </div>
      <div class="header-actions">
        <div class="bell-wrap" id="notif-bell">
          🔔<span class="bell-badge" id="notif-badge" style="display:none;"></span>
          <div class="notif-panel" id="notif-panel"></div>
        </div>
      </div>
    </div>
    <div id="content">Loading...</div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/app.js"></script>
<script>
let profile = null;
let students = [];
let attendanceByStudent = {};
let leaveRequests = [];
let subjects = [];
let marksByStudent = {};
let events = [];
let currentView = 'students';
let selectedStudentId = null;
let searchTerm = '';

async function init() {
  initTheme();
  document.getElementById('theme-toggle-btn').textContent = (document.documentElement.getAttribute('data-theme') === 'dark') ? '☀️' : '🌙';
  profile = await requireRole('incharge');
  if (!profile) return;
  document.getElementById('who-name').textContent = profile.name;
  document.getElementById('who-meta').textContent = `${profile.department} · Section ${profile.section}`;
  document.getElementById('today-date').textContent = new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      currentView = item.dataset.view;
      selectedStudentId = null;
      document.getElementById('view-title').textContent = item.textContent;
      renderView();
    });
  });

  await loadAll();
  initNotificationBell(profile);
}

async function loadAll() {
  const { data: st } = await supabaseClient.from('profiles').select('*')
    .eq('role', 'student').eq('department', profile.department).eq('section', profile.section).order('roll_no');
  students = st || [];

  const studentIds = students.map(s => s.id);
  const safeIds = studentIds.length ? studentIds : ['00000000-0000-0000-0000-000000000000'];

  const [{ data: att }, { data: lv }, { data: subj }, { data: mk }, { data: ev }] = await Promise.all([
    supabaseClient.from('attendance').select('*').in('student_id', safeIds),
    supabaseClient.from('leave_requests').select('*').in('student_id', safeIds).order('created_at', { ascending: false }),
    supabaseClient.from('subjects').select('*').eq('department', profile.department),
    supabaseClient.from('marks').select('*').in('student_id', safeIds),
    supabaseClient.from('events').select('*').or(`department.eq.${profile.department},department.eq.ALL`).order('created_at', { ascending: false }).limit(20),
  ]);

  attendanceByStudent = {};
  (att || []).forEach(r => { (attendanceByStudent[r.student_id] = attendanceByStudent[r.student_id] || []).push(r); });
  leaveRequests = lv || [];
  subjects = subj || [];
  marksByStudent = {};
  (mk || []).forEach(m => { (marksByStudent[m.student_id] = marksByStudent[m.student_id] || []).push(m); });
  events = ev || [];

  renderView();
}

function statsFor(studentId) { return attendanceStatsFrom(attendanceByStudent[studentId] || []); }

async function renderView() {
  const c = document.getElementById('content');
  if (currentView === 'students') {
    c.innerHTML = selectedStudentId ? await renderStudentDetail(selectedStudentId) : renderStudentList();
  } else if (currentView === 'attendance') {
    c.innerHTML = renderAttendanceForm();
  } else if (currentView === 'leave') {
    c.innerHTML = renderLeaveRequests();
  } else if (currentView === 'marks') {
    c.innerHTML = renderMarksUpload();
  } else if (currentView === 'reports') {
    c.innerHTML = renderReports();
  } else if (currentView === 'notices') {
    c.innerHTML = renderNotices();
  }
  attachHandlers();
}

function renderStudentList() {
  const withStats = students.map(s => ({ ...s, attendance: statsFor(s.id) }));
  const filtered = searchTerm ? withStats.filter(s => s.name.toLowerCase().includes(searchTerm.toLowerCase()) || s.roll_no.toLowerCase().includes(searchTerm.toLowerCase())) : withStats;
  const avgAttendance = withStats.length ? Math.round(withStats.reduce((a,b)=>a+b.attendance.percentage,0)/withStats.length) : 0;
  const lowAttendance = withStats.filter(st => st.attendance.percentage < 75).length;

  return `
    <div class="grid cols-3">
      <div class="card"><h3>Total Students</h3><div class="big-num">${withStats.length}</div></div>
      <div class="card"><h3>Avg Attendance</h3><div class="big-num">${avgAttendance}%</div></div>
      <div class="card"><h3>Below 75%</h3><div class="big-num" style="color:${lowAttendance ? 'var(--absent)' : 'var(--present)'}">${lowAttendance}</div></div>
    </div>
    <h2 class="section-title">Section ${profile.section} Students</h2>
    <div class="card">
      <div class="form-row"><input type="text" class="search-input" id="student-search" placeholder="Search by name or roll no..." value="${searchTerm}"></div>
      <table>
        <thead><tr><th>Roll No</th><th>Name</th><th>Attendance</th><th></th></tr></thead>
        <tbody>
          ${filtered.map(st => `
            <tr>
              <td class="mono">${st.roll_no}</td>
              <td>${st.name}</td>
              <td><span class="pill ${st.attendance.percentage >= 75 ? 'present' : 'absent'}">${st.attendance.percentage}%</span></td>
              <td><button class="btn small outline" data-view-student="${st.id}">View details</button></td>
            </tr>`).join('') || '<tr><td colspan="4" class="muted">No students match your search.</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}

async function renderStudentDetail(studentId) {
  const student = students.find(s => s.id === studentId);
  const marks = marksByStudent[studentId] || [];
  const backlogCount = marks.filter(m => m.backlog).length;
  const stats = statsFor(studentId);
  const recent = (attendanceByStudent[studentId] || []).slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,14);
  const studentLeaves = leaveRequests.filter(l => l.student_id === studentId);
  return `
    <button class="btn small outline" data-back="1" style="width:auto;margin-bottom:20px;">← Back to class list</button>
    <div class="grid cols-4">
      <div class="card"><h3>Roll No</h3><div class="big-num" style="font-size:20px;">${student.roll_no}</div></div>
      <div class="card"><h3>Attendance</h3><div class="flex-between">${attendanceRingSVG(stats.percentage, 60)}</div></div>
      <div class="card"><h3>Backlogs</h3><div class="big-num" style="color:${backlogCount ? 'var(--absent)' : 'var(--present)'}">${backlogCount}</div></div>
      <div class="card"><h3>Semester</h3><div class="big-num">${student.semester ?? '—'}</div></div>
    </div>
    <h2 class="section-title">Contact / Parent Info</h2>
    <div class="card">
      <div class="grid cols-2">
        <div><label class="muted" style="font-size:12px;">Phone</label><div>${student.phone ?? '—'}</div></div>
        <div><label class="muted" style="font-size:12px;">Blood Group</label><div>${student.blood_group ?? '—'}</div></div>
        <div><label class="muted" style="font-size:12px;">Parent Name</label><div>${student.parent_name ?? '—'}</div></div>
        <div><label class="muted" style="font-size:12px;">Parent Phone</label><div>${student.parent_phone ?? '—'}</div></div>
      </div>
    </div>
    <h2 class="section-title">Marks</h2>
    <div class="card">
      <table><thead><tr><th>Subject</th><th>Internal 1</th><th>Internal 2</th><th>Semester Exam</th><th>Status</th></tr></thead>
      <tbody>${marks.map(m => `<tr><td>${m.subject}</td><td>${m.internal1??'—'}</td><td>${m.internal2??'—'}</td><td>${m.semester_exam??'—'}/${m.max_marks}</td><td><span class="pill ${m.backlog?'backlog':'cleared'}">${m.backlog?'Backlog':'Cleared'}</span></td></tr>`).join('')}</tbody></table>
    </div>
    <h2 class="section-title">Recent Attendance</h2>
    <div class="card">
      <table><thead><tr><th>Date</th><th>Status</th><th>Details</th></tr></thead>
      <tbody>${recent.map(r => `<tr><td>${fmtDate(r.date)}</td><td><span class="pill ${r.status}">${r.status}</span></td><td class="muted">${r.location || r.reason || '—'}</td></tr>`).join('')}</tbody></table>
    </div>
    <h2 class="section-title">Leave History</h2>
    <div class="card">
      <table><thead><tr><th>Dates</th><th>Type</th><th>Status</th></tr></thead>
      <tbody>${studentLeaves.map(l => `<tr><td>${fmtDate(l.from_date)}–${fmtDate(l.to_date)}</td><td>${l.reason_type}</td><td><span class="pill ${l.status.toLowerCase()}">${l.status}</span></td></tr>`).join('') || '<tr><td colspan="3" class="muted">None</td></tr>'}</tbody></table>
    </div>
  `;
}

function renderAttendanceForm() {
  const today = new Date().toISOString().split('T')[0];
  return `
    <div class="card">
      <div class="form-row">
        <div>
          <label style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;display:block;margin-bottom:6px;">Date</label>
          <input type="date" id="attendance-date" value="${today}" style="padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--parchment);color:var(--ink);">
        </div>
        <button class="btn small outline" id="mark-all-present-btn">Mark all Present</button>
        <button class="btn gold small" id="save-attendance-btn" style="margin-left:auto;">Save attendance</button>
      </div>
      <table>
        <thead><tr><th>Roll No</th><th>Name</th><th>Mark Status</th></tr></thead>
        <tbody>
          ${students.map(st => `
            <tr>
              <td class="mono">${st.roll_no}</td>
              <td>${st.name}</td>
              <td>
                <select data-student-status="${st.id}">
                  <option value="present">Present</option>
                  <option value="absent">Absent</option>
                  <option value="leave">On Leave</option>
                </select>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderLeaveRequests() {
  const withNames = leaveRequests.map(l => ({ ...l, student: students.find(s => s.id === l.student_id) })).filter(l => l.student);
  const pending = withNames.filter(l => l.status === 'Pending');
  return `
    <h2 class="section-title">Pending Requests (${pending.length})</h2>
    <div class="card">
      ${pending.map(l => `
        <div class="event-item">
          <h4>${l.student.name} <span class="muted mono" style="font-weight:400;">(${l.student.roll_no})</span></h4>
          <p>${l.reason_type} — ${fmtDate(l.from_date)} to ${fmtDate(l.to_date)}</p>
          <p class="muted">${l.reason_text || ''}</p>
          ${l.certificate_url ? `<button class="btn small outline" data-view-cert="${l.certificate_url}" style="width:auto;margin-top:6px;">View Certificate</button>` : ''}
          <div class="form-row" style="margin-top:10px;">
            <input type="text" placeholder="Remarks (optional)" id="remarks-${l.id}" style="flex:1;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--parchment);color:var(--ink);">
            <button class="btn small gold" data-approve-leave="${l.id}">Approve</button>
            <button class="btn small danger" data-reject-leave="${l.id}">Reject</button>
          </div>
        </div>`).join('') || '<p class="muted">No pending requests. 🎉</p>'}
    </div>

    <h2 class="section-title">All Requests</h2>
    <div class="card">
      <table>
        <thead><tr><th>Student</th><th>Dates</th><th>Type</th><th>Status</th><th>Remarks</th></tr></thead>
        <tbody>
          ${withNames.map(l => `
            <tr>
              <td>${l.student.name} <span class="muted mono">(${l.student.roll_no})</span></td>
              <td>${fmtDate(l.from_date)}–${fmtDate(l.to_date)}</td>
              <td>${l.reason_type}</td>
              <td><span class="pill ${l.status.toLowerCase()}">${l.status}</span></td>
              <td class="muted">${l.remarks || '—'}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderMarksUpload() {
  return `
    <div class="card">
      <div class="form-row">
        <div style="flex:1;">
          <label style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;display:block;margin-bottom:6px;">Subject</label>
          <select id="marks-subject-select">
            ${subjects.map(s => `<option value="${s.name}">${s.name}</option>`).join('')}
          </select>
        </div>
      </div>
      <table>
        <thead><tr><th>Roll No</th><th>Name</th><th>Internal 1</th><th>Internal 2</th><th>Assignment</th><th>Lab</th><th>Semester Exam</th></tr></thead>
        <tbody>
          ${students.map(st => `
            <tr>
              <td class="mono">${st.roll_no}</td>
              <td>${st.name}</td>
              <td><input type="number" min="0" max="100" data-mark-i1="${st.id}" style="width:70px;padding:6px;border:1px solid var(--border);border-radius:6px;background:var(--parchment);color:var(--ink);"></td>
              <td><input type="number" min="0" max="100" data-mark-i2="${st.id}" style="width:70px;padding:6px;border:1px solid var(--border);border-radius:6px;background:var(--parchment);color:var(--ink);"></td>
              <td><input type="number" min="0" max="20" data-mark-asg="${st.id}" style="width:70px;padding:6px;border:1px solid var(--border);border-radius:6px;background:var(--parchment);color:var(--ink);"></td>
              <td><input type="number" min="0" max="20" data-mark-lab="${st.id}" style="width:70px;padding:6px;border:1px solid var(--border);border-radius:6px;background:var(--parchment);color:var(--ink);"></td>
              <td><input type="number" min="0" max="100" data-mark-sem="${st.id}" style="width:70px;padding:6px;border:1px solid var(--border);border-radius:6px;background:var(--parchment);color:var(--ink);"></td>
            </tr>`).join('')}
        </tbody>
      </table>
      <button class="btn gold small" id="save-marks-btn" style="margin-top:16px;width:auto;">Save Marks</button>
    </div>
  `;
}

function renderReports() {
  const withStats = students.map(s => ({ ...s, attendance: statsFor(s.id), marks: marksByStudent[s.id] || [] }));
  const below75 = withStats.filter(s => s.attendance.percentage < 75);
  const topStudents = withStats.slice().sort((a,b) => b.attendance.percentage - a.attendance.percentage).slice(0,5);
  const backlogStudents = withStats.filter(s => s.marks.some(m => m.backlog));

  return `
    <div class="tabs">
      <div class="tab active" data-report-tab="below75">Below 75%</div>
      <div class="tab" data-report-tab="top">Top Students</div>
      <div class="tab" data-report-tab="backlogs">Backlogs</div>
      <div class="tab" data-report-tab="today">Today's Attendance</div>
    </div>
    <div id="report-content">${reportTableHtml('below75', below75)}</div>
    <div class="form-row" style="margin-top:16px;">
      <button class="btn small outline" id="export-csv-btn">📊 Export Excel (CSV)</button>
      <button class="btn small outline" id="export-pdf-btn">🖨️ Export PDF</button>
    </div>
  `;
}

function reportTableHtml(kind, list) {
  if (kind === 'today') {
    const today = new Date().toISOString().split('T')[0];
    const todayRows = students.map(s => {
      const rec = (attendanceByStudent[s.id] || []).find(a => a.date === today);
      return { ...s, status: rec ? rec.status : 'Not marked' };
    });
    return `<div class="card"><table><thead><tr><th>Roll No</th><th>Name</th><th>Status</th></tr></thead><tbody>
      ${todayRows.map(s => `<tr><td class="mono">${s.roll_no}</td><td>${s.name}</td><td><span class="pill ${s.status==='present'?'present':s.status==='absent'?'absent':'pending'}">${s.status}</span></td></tr>`).join('')}
    </tbody></table></div>`;
  }
  return `<div class="card"><table><thead><tr><th>Roll No</th><th>Name</th><th>Attendance</th><th>Backlogs</th></tr></thead><tbody>
    ${list.map(s => `<tr><td class="mono">${s.roll_no}</td><td>${s.name}</td><td>${s.attendance.percentage}%</td><td>${(s.marks||[]).filter(m=>m.backlog).length}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">None</td></tr>'}
  </tbody></table></div>`;
}

function renderNotices() {
  return `
    <div class="card" style="max-width:560px;">
      <div class="field"><label>Title</label><input type="text" id="notice-title" placeholder="e.g. Submit assignment by Friday"></div>
      <div class="field"><label>Message</label><textarea id="notice-message" rows="4" placeholder="Details for your class..."></textarea></div>
      <button class="btn gold" id="send-notice-btn">Send to Section ${profile.section}</button>
      <p class="stat-note" style="margin-top:10px;">This posts as a class announcement and sends a real-time notification to your students.</p>
    </div>
    <h2 class="section-title">Recent Notices</h2>
    <div class="card">${events.filter(e => e.type === 'announcement').map(eventItemSimple).join('') || '<p class="muted">No notices sent yet.</p>'}</div>
  `;
}

function eventItemSimple(e) {
  return `<div class="event-item"><div class="event-type">${e.type}</div><h4>${e.title}</h4><p>${e.description||''}</p><div class="event-date">Posted ${timeAgo(e.created_at)}</div></div>`;
}

function attachHandlers() {
  document.querySelectorAll('[data-view-student]').forEach(btn => btn.addEventListener('click', () => { selectedStudentId = btn.dataset.viewStudent; renderView(); }));
  const back = document.querySelector('[data-back]'); if (back) back.addEventListener('click', () => { selectedStudentId = null; renderView(); });

  const searchInput = document.getElementById('student-search');
  if (searchInput) searchInput.addEventListener('input', (e) => { searchTerm = e.target.value; renderView(); });

  const markAllBtn = document.getElementById('mark-all-present-btn');
  if (markAllBtn) markAllBtn.addEventListener('click', () => {
    document.querySelectorAll('[data-student-status]').forEach(sel => sel.value = 'present');
  });

  const saveAttBtn = document.getElementById('save-attendance-btn');
  if (saveAttBtn) saveAttBtn.addEventListener('click', async () => {
    const date = document.getElementById('attendance-date').value;
    const records = [...document.querySelectorAll('[data-student-status]')].map(sel => ({
      student_id: sel.dataset.studentStatus, date, status: sel.value, marked_by: 'incharge', subject_id: null,
    }));
    saveAttBtn.disabled = true; saveAttBtn.textContent = 'Saving...';
    try {
      const { error } = await supabaseClient.from('attendance').upsert(records, { onConflict: 'student_id,date,subject_id' });
      if (error) throw new Error(error.message);
      await pushNotification({ title: 'Attendance Updated', message: `Attendance for ${fmtDate(date)} has been updated.`, type: 'attendance', department: profile.department, section: profile.section });
      toast('✅ Saved', `Attendance updated for ${fmtDate(date)}. Students can now see it.`);
      await loadAll();
    } catch (e) { toast('❌ Error', e.message); }
    saveAttBtn.disabled = false; saveAttBtn.textContent = 'Save attendance';
  });

  document.querySelectorAll('[data-approve-leave]').forEach(btn => btn.addEventListener('click', async () => {
    const id = btn.dataset.approveLeave;
    const remarks = document.getElementById(`remarks-${id}`)?.value || '';
    try {
      const { error } = await supabaseClient.from('leave_requests').update({ status: 'Approved', remarks, reviewed_by: profile.id }).eq('id', id);
      if (error) throw new Error(error.message);
      const lv = leaveRequests.find(l => l.id == id);
      await pushNotification({ title: 'Leave Approved', message: `Your leave request has been approved.`, type: 'leave', department: profile.department, student_id: lv?.student_id });
      toast('✅ Approved', 'Leave request approved.');
      await loadAll();
    } catch (e) { toast('❌ Error', e.message); }
  }));

  document.querySelectorAll('[data-reject-leave]').forEach(btn => btn.addEventListener('click', async () => {
    const id = btn.dataset.rejectLeave;
    const remarks = document.getElementById(`remarks-${id}`)?.value || '';
    try {
      const { error } = await supabaseClient.from('leave_requests').update({ status: 'Rejected', remarks, reviewed_by: profile.id }).eq('id', id);
      if (error) throw new Error(error.message);
      const lv = leaveRequests.find(l => l.id == id);
      await pushNotification({ title: 'Leave Rejected', message: remarks || 'Your leave request was rejected.', type: 'leave', department: profile.department, student_id: lv?.student_id });
      toast('❌ Rejected', 'Leave request rejected.');
      await loadAll();
    } catch (e) { toast('❌ Error', e.message); }
  }));

  document.querySelectorAll('[data-view-cert]').forEach(btn => btn.addEventListener('click', async () => {
    const path = btn.dataset.viewCert;
    const { data, error } = await supabaseClient.storage.from('medical-certificates').createSignedUrl(path, 60);
    if (error) { toast('❌ Error', error.message); return; }
    window.open(data.signedUrl, '_blank');
  }));

  const saveMarksBtn = document.getElementById('save-marks-btn');
  if (saveMarksBtn) saveMarksBtn.addEventListener('click', async () => {
    const subject = document.getElementById('marks-subject-select').value;
    saveMarksBtn.disabled = true; saveMarksBtn.textContent = 'Saving...';
    try {
      const records = students.map(st => ({
        student_id: st.id, subject, semester: st.semester || 3,
        internal1: parseFloat(document.querySelector(`[data-mark-i1="${st.id}"]`).value) || null,
        internal2: parseFloat(document.querySelector(`[data-mark-i2="${st.id}"]`).value) || null,
        assignment: parseFloat(document.querySelector(`[data-mark-asg="${st.id}"]`).value) || null,
        lab: parseFloat(document.querySelector(`[data-mark-lab="${st.id}"]`).value) || null,
        semester_exam: parseFloat(document.querySelector(`[data-mark-sem="${st.id}"]`).value) || null,
      })).filter(r => r.internal1 !== null || r.internal2 !== null || r.semester_exam !== null);
      if (!records.length) { toast('⚠️ Nothing to save', 'Enter at least one mark.'); saveMarksBtn.disabled = false; saveMarksBtn.textContent = 'Save Marks'; return; }
      records.forEach(r => { r.backlog = (r.semester_exam !== null && r.semester_exam < 40); });
      const { error } = await supabaseClient.from('marks').upsert(records, { onConflict: 'student_id,subject,semester' });
      if (error) throw new Error(error.message);
      await pushNotification({ title: 'Marks Updated', message: `${subject} marks have been updated.`, type: 'marks', department: profile.department, section: profile.section });
      toast('✅ Saved', `${subject} marks updated for all students.`);
      await loadAll();
    } catch (e) { toast('❌ Error', e.message); }
    saveMarksBtn.disabled = false; saveMarksBtn.textContent = 'Save Marks';
  });

  document.querySelectorAll('[data-report-tab]').forEach(tab => tab.addEventListener('click', () => {
    document.querySelectorAll('[data-report-tab]').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const withStats = students.map(s => ({ ...s, attendance: statsFor(s.id), marks: marksByStudent[s.id] || [] }));
    const kind = tab.dataset.reportTab;
    let list = [];
    if (kind === 'below75') list = withStats.filter(s => s.attendance.percentage < 75);
    else if (kind === 'top') list = withStats.slice().sort((a,b) => b.attendance.percentage - a.attendance.percentage).slice(0,5);
    else if (kind === 'backlogs') list = withStats.filter(s => s.marks.some(m => m.backlog));
    document.getElementById('report-content').innerHTML = reportTableHtml(kind, list);
  }));

  const exportCsvBtn = document.getElementById('export-csv-btn');
  if (exportCsvBtn) exportCsvBtn.addEventListener('click', () => {
    const withStats = students.map(s => ({ ...s, attendance: statsFor(s.id) }));
    exportToCSV(`section_${profile.section}_report.csv`, ['Roll No','Name','Attendance %','Backlogs'],
      withStats.map(s => [s.roll_no, s.name, s.attendance.percentage, (marksByStudent[s.id]||[]).filter(m=>m.backlog).length]));
  });

  const exportPdfBtn = document.getElementById('export-pdf-btn');
  if (exportPdfBtn) exportPdfBtn.addEventListener('click', () => {
    const withStats = students.map(s => ({ ...s, attendance: statsFor(s.id) }));
    const rows = withStats.map(s => `<tr><td>${s.roll_no}</td><td>${s.name}</td><td>${s.attendance.percentage}%</td></tr>`).join('');
    printReport(`Section ${profile.section} Report — ${profile.department}`, `<table><tr><th>Roll No</th><th>Name</th><th>Attendance</th></tr>${rows}</table>`);
  });

  const sendNoticeBtn = document.getElementById('send-notice-btn');
  if (sendNoticeBtn) sendNoticeBtn.addEventListener('click', async () => {
    const title = document.getElementById('notice-title').value.trim();
    const description = document.getElementById('notice-message').value.trim();
    if (!title) { toast('⚠️ Missing title', 'Please enter a title.'); return; }
    sendNoticeBtn.disabled = true; sendNoticeBtn.textContent = 'Sending...';
    try {
      const { error: e1 } = await supabaseClient.from('events').insert({ title, description, type: 'announcement', department: profile.department, posted_by: profile.id });
      if (e1) throw new Error(e1.message);
      await pushNotification({ title, message: description, type: 'notice', department: profile.department, section: profile.section });
      toast('✅ Sent', 'Your class has been notified.');
      document.getElementById('notice-title').value = '';
      document.getElementById('notice-message').value = '';
      await loadAll();
    } catch (e) { toast('❌ Error', e.message); }
    sendNoticeBtn.disabled = false; sendNoticeBtn.textContent = `Send to Section ${profile.section}`;
  });
}

init();
</script>
</body>
</html>
