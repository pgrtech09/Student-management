<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Vidya Campus</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2A4A">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
</head>
<body>
<div class="login-wrap">
  <div class="login-card" style="max-width:460px;">
    <div class="login-badge">VC</div>
    <h1>Student Registration</h1>
    <p class="sub">Your Date of Birth becomes your login password — no need to remember a new one.</p>

    <form id="register-form">
      <div class="field">
        <label>Full Name</label>
        <input type="text" id="name" required placeholder="Aarav Sharma" />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required placeholder="you@college.edu" />
      </div>
      <div class="field">
        <label>Hall Ticket / Roll Number</label>
        <input type="text" id="roll_no" required placeholder="e.g. 21A91A0501" />
      </div>
      <div class="field">
        <label>Date of Birth</label>
        <input type="date" id="dob" required />
      </div>
      <div class="field">
        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="9876543210" />
      </div>
      <div class="field">
        <label>Blood Group</label>
        <select id="blood_group">
          <option value="">Select...</option>
          <option>O+</option><option>O-</option>
          <option>A+</option><option>A-</option>
          <option>B+</option><option>B-</option>
          <option>AB+</option><option>AB-</option>
        </select>
      </div>
      <div class="field">
        <label>Department / Branch</label>
        <select id="department" required>
          <option value="">Select branch...</option>
          <option value="CSE">CSE</option>
          <option value="ECE">ECE</option>
          <option value="EEE">EEE</option>
          <option value="MECH">MECH</option>
          <option value="CIVIL">CIVIL</option>
          <option value="IT">IT</option>
        </select>
      </div>
      <div class="field">
        <label>Section</label>
        <select id="section" required>
          <option value="">Select section...</option>
          <option value="A">A</option><option value="B">B</option>
          <option value="C">C</option><option value="D">D</option>
        </select>
      </div>
      <div class="field">
        <label>Semester</label>
        <select id="semester" required>
          <option value="">Select semester...</option>
          <option value="1">1</option><option value="2">2</option>
          <option value="3">3</option><option value="4">4</option>
          <option value="5">5</option><option value="6">6</option>
          <option value="7">7</option><option value="8">8</option>
        </select>
      </div>
      <div class="field">
        <label>Year</label>
        <select id="year" required>
          <option value="">Select year...</option>
          <option value="1">1st Year</option><option value="2">2nd Year</option>
          <option value="3">3rd Year</option><option value="4">4th Year</option>
        </select>
      </div>
      <div class="field">
        <label>Parent / Guardian Name</label>
        <input type="text" id="parent_name" placeholder="Parent name" />
      </div>
      <div class="field">
        <label>Parent / Guardian Phone</label>
        <input type="tel" id="parent_phone" placeholder="9876500000" />
      </div>

      <button class="btn gold" type="submit" id="register-btn">Create my account</button>
      <div class="error-msg" id="error-msg"></div>
    </form>

    <div class="demo-creds">
      Already registered? <a href="login.html" style="color:var(--ink);font-weight:600;">Sign in here</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
initTheme();

function dobToPassword(dobStr) {
  // "1999-05-03" -> "03051999" (DDMMYYYY)
  const [y, m, d] = dobStr.split('-');
  return d + m + y;
}

document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('error-msg');
  const btn = document.getElementById('register-btn');
  errorEl.textContent = '';

  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const roll_no = document.getElementById('roll_no').value.trim();
  const dob = document.getElementById('dob').value;
  const phone = document.getElementById('phone').value.trim();
  const blood_group = document.getElementById('blood_group').value;
  const department = document.getElementById('department').value;
  const section = document.getElementById('section').value;
  const semester = document.getElementById('semester').value;
  const year = document.getElementById('year').value;
  const parent_name = document.getElementById('parent_name').value.trim();
  const parent_phone = document.getElementById('parent_phone').value.trim();

  if (!name || !email || !roll_no || !dob || !department || !section || !semester || !year) {
    errorEl.textContent = 'Please fill in all required fields.';
    return;
  }

  const password = dobToPassword(dob);
  btn.disabled = true;
  btn.textContent = 'Creating account...';

  try {
    const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({ email, password });
    if (signUpError) throw new Error(signUpError.message);

    if (!signUpData.session) {
      throw new Error('Account created, but email confirmation is still required on this project. Ask your HOD to turn off "Confirm email" in Supabase Auth settings, then sign in.');
    }

    const { error: profileError } = await supabaseClient.from('profiles').insert({
      id: signUpData.user.id, name, email, role: 'student',
      department, section, roll_no, semester: Number(semester), year: Number(year),
      dob, phone, blood_group, parent_name, parent_phone,
    });
    if (profileError) throw new Error(profileError.message);

    toast('✅ Account created', `Your password is ${password} (your DOB, DDMMYYYY). Taking you to your dashboard...`);
    setTimeout(() => { window.location.href = 'student/index.html'; }, 1800);
  } catch (err) {
    errorEl.textContent = err.message;
    btn.disabled = false;
    btn.textContent = 'Create my account';
  }
});
</script>
</body>
</html>
